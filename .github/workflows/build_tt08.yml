name: Build TT-08 Firmware

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Unmute Compiler Errors
        run: |
          sed -i 's/capture_output=True//g' scripts/release.py || true
          sed -i 's/stdout=subprocess.PIPE//g' scripts/release.py || true
          sed -i 's/stderr=subprocess.PIPE//g' scripts/release.py || true

      - name: Compile Custom Board
        run: |
          . $IDF_PATH/export.sh
          python3 scripts/release.py waveshare/esp32-s3-touch-lcd-3.49

      - name: Upload Compiled Firmware (.bin)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TT08-Custom-Firmware
          path: releases/*.zip
