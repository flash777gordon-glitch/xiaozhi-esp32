name: Build TT-08 Firmware

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compile Custom Board
        run: |
          . $IDF_PATH/export.sh
          export BOARD_TYPE=waveshare/esp32-s3-touch-lcd-3.49
          idf.py set-target esp32s3
          idf.py build
          esptool.py --chip esp32s3 merge_bin -o build/merged-binary.bin @build/flash_args

      - name: Upload Compiled Firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TT08-Custom-Firmware
          path: build/merged-binary.bin
          path: build/merged-binary.bin
