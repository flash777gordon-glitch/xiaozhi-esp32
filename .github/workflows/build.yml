name: Build TT-08 Firmware

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compile Custom Board
        run: |
          . $IDF_PATH/export.sh
          python3 scripts/release.py prepare waveshare/esp32-s3-touch-lcd-3.49

      - name: Upload Compiled Firmware (.bin)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TT08-Custom-Firmware
          path: |
            build/merged-binary.bin
            releases/*.zip
